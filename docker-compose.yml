services:
  postgres:
    image: postgres:16-alpine
    container_name: transactra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: transactra
      POSTGRES_PASSWORD: transactra
      POSTGRES_DB: transactra
    ports:
      - "5432:5432"
    volumes:
      - transactra_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transactra -d transactra"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  transactra_data: