name = "transactra-telegram"
main = "index.mjs"
compatibility_date = "2026-11-12"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "cloudpilot-staging"
database_id = "e7292f55-c90e-4d34-8b77-c97c3e5ec15a"

[[services]]
binding = "CLOUDPILOT"
service = "cloudpilot-edge"
environment = "production"

[triggers]
crons = ["*/5 * * * *"]

[vars]
DASHBOARD_URL = "https://transactra-dashboard.pages.dev"
TELEGRAM_BOT_USERNAME = "TransactraBot"
TELEGRAM_OWNER_ID = "8593447241"

[observability]
enabled = true
head_sampling_rate = 1.0

[observability.logs]
enabled = true
head_sampling_rate = 1.0
persist = true
invocation_logs = true

[observability.traces]
enabled = true
head_sampling_rate = 1.0
persist = true

# Secret bindings are managed separately in Cloudflare and are intentionally
# not included here: CLOUDPILOT_INFERENCE_SECRET, TELEGRAM_BOT_TOKEN,
# TELEGRAM_WEBHOOK_SECRET, and TRANSACTRA_AUTH_HEADER_SECRET.
