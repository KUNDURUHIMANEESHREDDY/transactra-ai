name = "transactra-edge"
main = "src/index.mjs"
compatibility_date = "2026-11-09"
workers_dev = true

# Isolated execution for agent-generated code. Dynamic Workers have no outbound network.
[[worker_loaders]]
binding = "LOADER"

# Cloudflare resources provisioned for Transactra. No credentials are stored here.
[[d1_databases]]
binding = "DB"
database_name = "transactra"
database_id = "faf1f8b5-e029-4598-9fb0-c3cb1106d311"
migrations_dir = "migrations"

[[queues.producers]]
binding = "EVENTS"
queue = "transactra-events"

[[queues.consumers]]
queue = "transactra-events"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "transactra-events-dlq"

[triggers]
crons = ["*/15 * * * *"]

[vars]
MEM0_ENABLED = "true"
MEM0_MONTHLY_ADDITION_LIMIT = "10000"
MEM0_MONTHLY_RETRIEVAL_LIMIT = "1000"
MEM0_COMPACTION_THRESHOLD_PERCENT = "70"
TRANSACTRA_ENV = "production"
CLOUDFLARE_ACCOUNT_ID = "e15f135fd5ae49e30f892777aebec675"
TRANSACTRA_D1_DATABASE_ID = "faf1f8b5-e029-4598-9fb0-c3cb1106d311"
TRANSACTRA_PLANNER_MODE = "d1-native"
TRANSACTRA_AGENT_EXECUTION_ENABLED = "true"
TRANSACTRA_MODEL_ORCHESTRATOR_ENABLED = "true"
NVIDIA_NIM_PLANNING_ENABLED = "true"
TELEGRAM_OWNER_ID = "8593447241"
# The API key remains a Worker secret and is never committed.
NVIDIA_NIM_FREE_TIER_VERIFIED_AT = "2026-11-10T04:35:59.866Z"
NVIDIA_NIM_MODEL = "stepfun-ai/step-5-preview"
NVIDIA_NIM_FALLBACK_MODELS = ""
NVIDIA_NIM_ZERO_COST_LIMIT_INR = "0"
NVIDIA_NIM_EXECUTION_ENABLED = "true"
NVIDIA_NIM_TIMEOUT_MS = "120000"
CLOUDPILOT_INFERENCE_URL = "https://cloudpilot-edge.himaneeshreddyk.workers.dev/chat/completions"

[ai]
binding = "AI"

# Keep production observability under source control; match the live Worker settings.
[observability]
enabled = true
head_sampling_rate = 1.0

[observability.logs]
enabled = true
head_sampling_rate = 1.0
persist = true
invocation_logs = true

[observability.traces]
enabled = true
head_sampling_rate = 1.0
persist = true
