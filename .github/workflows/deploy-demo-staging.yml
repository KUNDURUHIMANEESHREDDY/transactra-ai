name: Transactra Demo Staging Deploy
# Deploy only when the commit message contains [deploy-demo-staging].

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: transactra-demo-staging-deploy
  cancel-in-progress: false

jobs:
  deploy-demo-staging:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy-demo-staging]'))
    runs-on: windows-latest
    environment: transactra-staging
    timeout-minutes: 35
    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -File {0}
    env:
      CLOUDFLARE_ACCOUNT_ID: e15f135fd5ae49e30f892777aebec675
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run build and regression tests
        run: |
          pnpm test
          if ($LASTEXITCODE -ne 0) { throw "Build or regression tests failed." }
          node --experimental-sqlite --test infra/cloudflare/tests/*.test.mjs
          if ($LASTEXITCODE -ne 0) { throw "Cloudflare safety tests failed." }
          pnpm audit --audit-level high
          if ($LASTEXITCODE -ne 0) { throw "Dependency audit failed." }
          node scripts/security-gate.mjs
          if ($LASTEXITCODE -ne 0) { throw "Tracked-file secret scan failed." }

      - name: Validate staging-only release configuration
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CLOUDFLARE_API_TOKEN)) { throw "CLOUDFLARE_API_TOKEN is missing from the transactra-staging environment." }
          $config = Get-Content "infra/cloudflare/wrangler.staging.toml" -Raw
          foreach ($required in @(
            'name\s*=\s*"transactra-edge-staging"',
            'database_name\s*=\s*"transactra-staging"',
            'database_id\s*=\s*"312d97f4-47b4-4084-84d5-21c5fe9c5538"',
            'TRANSACTRA_ENV\s*=\s*"staging"',
            'TRANSACTRA_PLANNER_MODE\s*=\s*"d1-native"',
            'TRANSACTRA_AGENT_EXECUTION_ENABLED\s*=\s*"false"',
            'NVIDIA_NIM_EXECUTION_ENABLED\s*=\s*"false"',
            'TRANSACTRA_MODEL_ORCHESTRATOR_ENABLED\s*=\s*"false"',
            'NVIDIA_NIM_PLANNING_ENABLED\s*=\s*"false"'
          )) { if ($config -notmatch $required) { throw "Staging safety check failed: $required" } }
          if ($config -match 'database_name\s*=\s*"transactra"\s*(\r?\n|$)' -or
              $config -match 'database_id\s*=\s*"faf1f8b5-e029-4598-9fb0-c3cb1106d311"' -or
              $config -match 'queue\s*=\s*"transactra-events"') {
            throw "Production D1 or queue reference found in staging configuration. Refusing deployment."
          }

      - name: Deploy staging Worker only
        run: |
          pnpm exec wrangler deploy --config infra/cloudflare/wrangler.staging.toml
          if ($LASTEXITCODE -ne 0) { throw "Staging Worker deployment failed." }

      - name: Verify staging Worker health and readiness
        run: |
          $base = "https://transactra-edge-staging.himaneeshreddyk.workers.dev"
          foreach ($path in @("/health", "/ready")) {
            $response = Invoke-WebRequest -Uri ($base + $path) -Method Get -UseBasicParsing -TimeoutSec 25
            if ([int]$response.StatusCode -ne 200) { throw "Staging $path returned HTTP $($response.StatusCode)." }
            $data = [string]$response.Content | ConvertFrom-Json
            if ($data.ok -ne $true) { throw "Staging $path did not report ok=true." }
            if ($path -eq "/ready" -and ($data.ready -ne $true -or $data.planner -ne "d1-native")) {
              throw "Staging Worker is not ready with the D1-native planner."
            }
          }
